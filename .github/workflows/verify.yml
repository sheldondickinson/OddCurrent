name: Verify development milestones
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: g++ -std=c++17 tests/policy_test.cpp -o /tmp/policy-test && /tmp/policy-test
      - run: node --check web/assets/app.js
      - run: python scripts/profiles.py profiles/david-v1.json
      - run: python scripts/check_public.py
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: pip install -r requirements-firmware.txt
      - run: python scripts/build_firmware.py
      - run: sha256sum firmware/build/*.bin > firmware/build/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: DEVELOPMENT-ONLY-S3-N16R8-unsigned
          path: firmware/build/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t oddcurrent-ci .
      - name: Validate isolated container health and read-only runtime
        run: |
          python - <<'PY'
          import json, pathlib, secrets
          p=pathlib.Path('/tmp/oddcurrent-ci-runtime.json')
          p.write_text(json.dumps({'database':'/data/test.sqlite','public_origin':'https://lamp.example.invalid','demo':False,'oidc_issuer':'https://identity.example.invalid/','oidc_client_id':'ci-fixture','session_key':secrets.token_urlsafe(48)}))
          p.chmod(0o600)
          PY
          sudo chown 10001:10001 /tmp/oddcurrent-ci-runtime.json
          docker run -d --name oddcurrent-ci --read-only --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 -p 127.0.0.1:8787:8787 -v /tmp/oddcurrent-ci-runtime.json:/run/secrets/runtime.json:ro oddcurrent-ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz; then exit 0; fi
            sleep 1
          done
          docker logs oddcurrent-ci
          exit 1
