[platformio]
default_envs = oddcurrent_s3_n16r8

[env:oddcurrent_s3_n16r8]
extends = env:esp32s3dev_16MB_opi
; Upstream's Tasmota framework omits WiFiClientSecure; use its documented Espressif alternative.
platform = espressif32@6.13.0
platform_packages =
custom_usermods =
  audioreactive
  oddcurrent
lib_ignore =
  ESPAsyncTCP
lib_deps =
  esp32async/AsyncTCP @ 3.4.7
  bitbank2/AnimatedGIF @ 1.4.7
  https://github.com/Aircoookie/GifDecoder.git#bc3af189b6b1e06946569f6b4287f0b79a860f8e
  https://github.com/someweisguy/esp_dmx.git#47db25d8c515e76fabcf5fc5ab0b786f98eeade0
  IRremoteESP8266 @ 2.8.2
  https://github.com/Makuna/NeoPixelBus.git#1d7ff38f14d04a976f9c6e365c83a232bcba04fc
  https://github.com/Aircoookie/ESPAsyncWebServer.git#39b830c852054444ea12a8b5d7fcb4fa004a89d7
  marvinroger/AsyncMqttClient @ 0.9.0
  https://github.com/blazoncek/QuickESPNow.git#2985a4a6eb67b9f3bc07e7b6b267716ac1b0c4b9
  links2004/WebSockets @ 2.6.1
  WiFiClientSecure
build_unflags =
  ${env:esp32s3dev_16MB_opi.build_unflags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D WLED_RELEASE_NAME=\"ESP32-S3_16MB_opi\"
build_flags =
  ${env:esp32s3dev_16MB_opi.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D WLED_RELEASE_NAME=\"OddCurrent_S3_N16R8\"
  -D ODDCURRENT_BRIDGE
  -D ARDUINOJSON_USE_LONG_LONG=1
  -D SR_DMTYPE=1
  -D I2S_CKPIN=10
  -D I2S_WSPIN=11
  -D I2S_SDPIN=12
  -D MCLK_PIN=-1
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_INFRARED
