[platformio]
default_envs = oddcurrent_s3_n16r8

[env:oddcurrent_s3_n16r8]
extends = env:esp32s3dev_16MB_opi
; Upstream's Tasmota framework omits WiFiClientSecure; use its documented Espressif alternative.
platform = espressif32@6.13.0
platform_packages =
custom_usermods =
  audioreactive
  oddcurrent
lib_ignore =
  ESPAsyncTCP
lib_deps =
  ${esp32s3.lib_deps}
  links2004/WebSockets @ 2.6.1
  WiFiClientSecure
build_unflags =
  ${env:esp32s3dev_16MB_opi.build_unflags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D WLED_RELEASE_NAME=\"ESP32-S3_16MB_opi\"
build_flags =
  ${env:esp32s3dev_16MB_opi.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D WLED_RELEASE_NAME=\"OddCurrent_S3_N16R8\"
  -D ODDCURRENT_BRIDGE
  -D SR_DMTYPE=1
  -D I2S_CKPIN=10
  -D I2S_WSPIN=11
  -D I2S_SDPIN=12
  -D MCLK_PIN=-1
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_INFRARED
