services:
  oddcurrent:
    build:
      context: .
      dockerfile: server/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:8787:8787"]
    volumes: ["oddcurrent-data:/data"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    secrets:
      - source: runtime
        target: runtime.json
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
secrets:
  runtime:
    file: ./secrets/runtime.json
volumes:
  oddcurrent-data:
